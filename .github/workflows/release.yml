name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.0 -c constraints.txt

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('fxreport/__init__.py').read_text()).group(1))")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Build sdist and wheel
        run: python -m build

      - name: Show artifacts
        run: ls -l dist/

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl -c constraints.txt
          /tmp/smoke/bin/fxreport --version | tee /tmp/version.txt
          grep -qx "fxreport ${GITHUB_REF_NAME#v}" /tmp/version.txt

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.whl dist/*.tar.gz \
              --title "$tag" \
              --generate-notes
          fi
          gh release view "$tag" --json assets
